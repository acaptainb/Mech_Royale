name: Match container check
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 verify.py --docker
      # The image verify.py just built must show the v6 engagement behaviour.
      - run: python3 tools/engagement_probe.py --docker
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python verify.py
      - run: python tools/engagement_probe.py
